name: smoke

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup .NET 10 LTS
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Compile gameplay scripts and run smoke check
        run: dotnet run --project ci/NotoriousGarden.Smoke/NotoriousGarden.Smoke.csproj -c Release
